<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#09090a"><title>Enzo Card</title><style>html,body{margin:0;height:100%;background:#09090a;color:#f5f5f3;font:16px system-ui,-apple-system,sans-serif}p{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;margin:0}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#09090a}</style></head><body><script>(function(){document.body.insertAdjacentHTML('afterbegin','<p>Opening the card</p>');
// A card opens right here, on the Enzo Card address. It sits in a frame served by the card server, so a card can never read
// anything this site keeps in the browser (the web editor's sign-in). Anything that is not a card goes to the editor or the home page.
var H='https://card.lezamalegacyassurance.com',p=location.pathname,m=/^\/c\/([a-z0-9][a-z0-9-]{0,39})\/?$/.exec(p);

var f=document.createElement('iframe');f.title='Enzo Card';f.allow='web-share; clipboard-write';f.referrerPolicy='no-referrer';
f.src=H+'/c/'+m[1]+location.search+location.hash;document.body.appendChild(f);
})();</script><noscript><p>Turn on JavaScript to open this card.</p></noscript></body></html>
